- id: concise-reporting
  title: Reporting
  body: When reporting information to me, be extremely concise and sacrifice grammar for the sake of concision.

- id: use-rtk
  title: RTK
  body: >
    Prefix token-heavy shell commands with `rtk` so output costs fewer prompt tokens (git, ls, cat, grep/rg, test runners, docker, kubectl).
    Example: `rtk git status`, not `git status`.
    Use `rtk proxy <cmd>` only when unfiltered output is required.

- id: review-with-toolbelt
  title: Review
  body: >
    When I ask to review changes with toolbelt, run `tb review --host` from the repo root.
    Blocks until submit or tab close. No `<<<TOOLBELT_REVIEW`…`TOOLBELT_REVIEW>>>` → no action.
    Else apply compact payload: `ok:` keep; `fix:` revise/revert (+/-L comments, `|` snippet);
    `note:` comments only; `edit:` + `<<<`…`>>>` replace file; `notes:` overall. Unlisted = leave alone.
    Do not skip locations.

- id: git-identity
  title: Git identity
  body: >
    Attribute every commit to the identity in gitconfig (`user.name` / `user.email`).
    Run `git commit` with no `--author` and no GIT_AUTHOR_* or GIT_COMMITTER_* overrides.
    Leave Claude, Cursor, and other agents off author, committer, and Co-Authored-By.
